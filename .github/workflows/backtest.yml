name: 籌碼分數回測

on:
  schedule:
    - cron: "23 2 * * 6"     # 每週六 台北 10:23 用最新資料重跑
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/backtest.py
      - scripts/fetch.py
      - watchlist.txt

permissions:
  contents: write

concurrency:
  group: update-data          # 與每日更新共用，避免同時提交
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 執行回測
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/backtest.py || echo "BT_FAILED=1" >> "$GITHUB_ENV"

      - name: 提交結果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest.json data/backtest.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "結果沒有變更"
          else
            git commit -m "更新回測結果 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            # 網頁同時在推送（同步持股、自選股…）時 push 可能被拒，重試幾次
            for i in 1 2 3 4 5; do
              git pull --rebase && git push && break
              echo "推送失敗，第 $i 次重試"; git rebase --abort 2>/dev/null; sleep $((i * 5))
              [ "$i" = 5 ] && exit 1
            done
          fi

      - name: 回報結果
        if: env.BT_FAILED == '1'
        run: |
          echo "回測失敗，請查看 data/backtest.log"
          exit 1
