name: 測試法說會資料來源（暫時）
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/probe_mops.py]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: |
          python scripts/probe_mops.py
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe_mops.txt && git commit -m "測試法說會資料來源" && for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
