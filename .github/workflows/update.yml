name: 更新籌碼資料

on:
  schedule:
    # GitHub 排程使用 UTC 時間；台北 = UTC+8
    - cron: "17 9 * * 1-5"   # 台北 17:17（收盤、三大法人）
    - cron: "37 11 * * 1-5"  # 台北 19:37（備援：GitHub 排程常延遲或漏跑 17:17 那次）
    - cron: "7 14 * * 1-5"   # 台北 22:07（補上融資餘額）
    - cron: "47 5 * * 1-5"   # 台北 13:47（只更新大盤收盤）
    - cron: "23 22 * * 1-5"  # 台北 週二～週六 06:23（只更新大盤，補上前一晚美股收盤）
    - cron: "13 23 * * 1-5"  # 台北 週二～週六 07:13（備援：06:23 那次延遲或漏跑時補美股）
    - cron: "3 0 * * 2-6"    # 台北 週二～週六 08:03（再備援一次，開盤前一定要有美股收盤）
  workflow_dispatch:          # 可在 Actions 頁面手動執行；Cloudflare 定時器也是用這個準時觸發
    inputs:
      mode:
        description: "full＝完整更新、market＝只更新大盤"
        required: false
        default: "full"
  push:
    branches: [main]
    paths:
      - watchlist.txt         # 修改自選股清單後自動重抓
      - scripts/fetch.py
      - refresh.txt           # 網頁上按「立即更新資料」

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2            # 用來判斷這次是不是「只改了自選股清單」

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 抓取資料並計分
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          case "${{ github.event.schedule }}" in "47 5 * * 1-5"|"23 22 * * 1-5"|"13 23 * * 1-5"|"3 0 * * 2-6") MKT=1;; *) MKT=0;; esac
          [ "${{ github.event.inputs.mode }}" = "market" ] && MKT=1
          if [ "$MKT" = 1 ]; then
            python scripts/fetch.py --market || echo "FETCH_FAILED=1" >> "$GITHUB_ENV"
            echo "MARKET_ONLY=1" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "push" ] && [ "$(git diff --name-only HEAD~1 HEAD 2>/dev/null)" = "watchlist.txt" ]; then
            # 只改了自選股清單：移除的直接刪、新增的只抓那幾檔（約 20～40 秒）；不適用時程式會自動改跑完整更新
            python scripts/fetch.py --incremental || echo "FETCH_FAILED=1" >> "$GITHUB_ENV"
          else
            python scripts/fetch.py || echo "FETCH_FAILED=1" >> "$GITHUB_ENV"
          fi

      - name: 寄送 Email 日報（有設定 MAIL_USER / MAIL_PASS 才會寄）
        if: env.FETCH_FAILED != '1' && env.MARKET_ONLY != '1'
        continue-on-error: true
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          HOLDINGS: ${{ secrets.HOLDINGS }}
        run: python scripts/notify.py

      - name: 提交資料（失敗時也會提交 data/debug.log 以便除錯）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "資料沒有變更"
          else
            git commit -m "更新資料 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            # 網頁同時在推送（同步持股、自選股…）時 push 可能被拒，重試幾次
            for i in 1 2 3 4 5; do
              git pull --rebase && git push && break
              echo "推送失敗，第 $i 次重試"; git rebase --abort 2>/dev/null; sleep $((i * 5))
              [ "$i" = 5 ] && exit 1
            done
          fi

      - name: 回報抓取結果
        if: env.FETCH_FAILED == '1'
        run: |
          echo "抓取失敗，請查看 data/debug.log"
          exit 1
